# Lab members' keys sit with the tunnel account: a forward to the gateway's port, nothing else.
Match User tunnel
    AllowTcpForwarding local
    PermitOpen 127.0.0.1:8000
    PermitListen none
    AllowAgentForwarding no
    AllowStreamLocalForwarding no
    X11Forwarding no
    PermitTTY no
    ForceCommand /usr/sbin/nologin
